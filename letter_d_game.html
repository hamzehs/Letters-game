<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Catch the Letter D!</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;background:linear-gradient(155deg,#c9f3ff,#fff2cc 55%,#ffe2f3);color:#27315c;min-height:100dvh;overflow-x:hidden}.app{max-width:780px;margin:auto;padding:18px 14px 32px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:32px;font-weight:1000;color:#8054d9}.score{background:#fff;border-radius:30px;padding:10px 18px;box-shadow:0 5px 0 #e6d8ff;font-size:22px;font-weight:900}.hero{text-align:center;margin:6px auto 12px}.hero h1{font-size:clamp(30px,8vw,53px);margin:6px 0;color:#6940ba}.hero p{font-size:19px;font-weight:700;margin:4px 0 10px}.game{position:relative;height:280px;border:5px solid white;border-radius:30px;background:linear-gradient(#99dbff,#d7f5ff);overflow:hidden;box-shadow:0 12px 30px #91a7c344;touch-action:manipulation}.cloud{position:absolute;font-size:45px;opacity:.8;pointer-events:none}.cloud.one{left:7%;top:12%}.cloud.two{right:8%;top:24%}.ground{position:absolute;bottom:-20px;width:120%;left:-10%;height:65px;background:#a7e6a6;border-radius:50%}.fall{position:absolute;border:0;border-radius:22px;background:white;box-shadow:0 7px 0 #ffffff80,0 7px 14px #4984a555;width:70px;height:76px;font-size:48px;font-weight:1000;color:#6c3dc7;cursor:pointer;touch-action:manipulation;animation:drop linear forwards;user-select:none}.fall.small{color:#f05e98}.fall.wrong{color:#7aa0b0;background:#f4fbff}@keyframes drop{from{top:-85px}to{top:305px}}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:15px auto}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:20px;padding:12px 20px;font-size:18px;font-weight:900;color:#fff;background:#8d55e8;box-shadow:0 5px 0 #5e31a9}.btn.alt{background:#ff8a55;box-shadow:0 5px 0 #d65b2c}.words{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.tile{background:white;border:4px solid #fff;border-radius:24px;min-height:137px;box-shadow:0 6px 0 #e7d8f8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.tile .pic{font-size:clamp(48px,12vw,78px);line-height:1.1}.tile span:last-child{font-size:16px;font-weight:900;color:#7d51bc}.tile.active{border-color:#8fdf81;background:#f1ffe9}.msg{min-height:35px;text-align:center;font-size:24px;font-weight:1000;color:#7544c9}.footer{text-align:center;font-size:13px;color:#7e7094;margin-top:20px}.overlay{position:fixed;inset:0;background:#27204c99;display:grid;place-items:center;z-index:5;padding:22px}.modal{background:white;border-radius:34px;padding:32px 20px;text-align:center;max-width:440px;width:100%;box-shadow:0 16px 0 #c5a7f0}.modal h2{font-size:37px;color:#7843c5;margin:10px 0}.modal p{font-size:19px;line-height:1.5}.modal .btn{margin-top:12px}.hidden{display:none!important}@media(max-width:400px){.game{height:245px}.words{gap:8px}.tile{min-height:115px}.tile .pic{font-size:50px}.tile span:last-child{font-size:14px}}</style></head><body><main class="app"><div class="top"><div class="logo">D d 🌈</div><div class="score">⭐ <span id="score">0</span></div></div><section class="hero"><h1>Catch the D!</h1><p>👆 Tap D or d! 🎈</p></section><div class="game" id="game"><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="ground"></div></div><div class="msg" id="msg">🌟 Ready to play? 🌟</div><div class="actions"><button class="btn" id="start">▶️ Play</button><button class="btn alt" id="sound">🔊 Sound On</button></div><div class="words" id="words"></div><div class="footer">🦆 🐶 🚪 🎀 🦕 💎 · Learn the letter D</div></main><div class="overlay" id="intro"><div class="modal"><div style="font-size:65px">🦆 🦕 💎</div><h2>Letter D d!</h2><p>Catch the big <b>D</b> and little <b>d</b>!<br>Then tap the pictures to hear their names.</p><button class="btn" id="begin">🎮 Let's Play!</button></div></div><script>const items=[['🦆','Duck'],['🐶','Dog'],['🚪','Door'],['👧🏻🎀','Doll'],['🦕','Dinosaur'],['💎','Diamond']];let score=0,running=false,sound=true,timer=null,round=0;const game=document.getElementById('game'),msg=document.getElementById('msg'),scoreEl=document.getElementById('score');const words=document.getElementById('words');items.forEach(([emoji,name],i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<span class="pic">${emoji}</span><span>${name}</span>`;b.setAttribute('aria-label',name);b.onclick=()=>{document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));b.classList.add('active');msg.textContent='⭐ '+name+'!';say(name+' starts with D!')};words.appendChild(b)});function say(t){if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;u.pitch=1.18;window.speechSynthesis.speak(u)}function spawn(){if(!running)return;const chars=['D','d','B','b','P','p'];const c=chars[Math.random()<.68?Math.floor(Math.random()*2):2+Math.floor(Math.random()*4)];const el=document.createElement('button');el.className='fall '+(c==='d'?'small':c!=='D'?'wrong':'');el.textContent=c;el.setAttribute('aria-label','Letter '+c);el.style.left=(5+Math.random()*Math.max(1,game.clientWidth-90))+'px';el.style.animationDuration=(4.2+Math.random()*1.8)+'s';game.appendChild(el);el.onclick=()=>{if(c==='D'||c==='d'){score++;scoreEl.textContent=score;msg.textContent=['🌟 Great job!','🎉 Amazing!','👏 Well done!'][score%3];say('Great job! D!');el.remove();if(score>=15)finish()}else{msg.textContent='💗 Try again!';say('Try again!');el.remove()}};el.addEventListener('animationend',()=>el.remove());round++;timer=setTimeout(spawn,Math.max(600,1250-score*25))}function clearGame(){running=false;clearTimeout(timer);document.querySelectorAll('.fall').forEach(x=>x.remove())}function start(){document.getElementById('intro').classList.add('hidden');clearGame();score=0;scoreEl.textContent=0;round=0;running=true;msg.textContent='👆 Catch D and d!';document.getElementById('start').textContent='🔄 Restart';say('Catch the letter D!');spawn()}function finish(){running=false;clearGame();msg.textContent='🏆 ⭐ You did it! ⭐ 🏆';say('Amazing! You are a letter D superstar!')}document.getElementById('begin').onclick=()=>{document.getElementById('intro').classList.add('hidden');start()};document.getElementById('start').onclick=start;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Sound On':'🔇 Sound Off';if(sound)say('Letter D!')};</script></body></html>
