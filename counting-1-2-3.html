<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Counting Fun 1 2 3</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial Rounded MT Bold',sans-serif;background:linear-gradient(145deg,#fff1c8,#fce2f4 50%,#d9f3ff);min-height:100dvh;color:#344268}.app{max-width:640px;margin:auto;padding:18px 16px 32px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#fff;border-radius:40px;padding:9px 16px;box-shadow:0 4px 0 #d8dbe7;font-weight:800}.heading{font-size:clamp(28px,8vw,42px);margin:18px 0 4px}.sub{font-size:17px;margin:0 0 14px}.board{background:#fff;border-radius:30px;padding:20px 14px;box-shadow:0 12px 35px #7988a82b;min-height:345px}.prompt{font-size:clamp(23px,6vw,33px);font-weight:900;margin:3px 0 12px}.things{min-height:155px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.thing{font-size:clamp(70px,19vw,104px);filter:drop-shadow(0 6px 2px #d4d7e3);animation:pop .4s both}.thing:nth-child(2){animation-delay:.1s}.thing:nth-child(3){animation-delay:.2s}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.choice{font-size:clamp(54px,16vw,86px);font-weight:900;border:4px solid #fff;border-radius:24px;min-height:120px;background:#e8f1ff;color:#425fc8;box-shadow:0 7px 0 #b4c5e7;cursor:pointer;touch-action:manipulation}.choice:nth-child(2){background:#fff0cf;color:#dd8a12;box-shadow:0 7px 0 #f0cf88}.choice:nth-child(3){background:#ffe1ed;color:#d55b91;box-shadow:0 7px 0 #e9b2c9}.choice:active{transform:translateY(5px);box-shadow:none}.choice:disabled{opacity:.65}.feedback{min-height:45px;font-size:27px;font-weight:900;margin-top:18px}.actions{display:flex;gap:10px;justify-content:center;margin-top:16px}.action{border:0;border-radius:18px;padding:15px 23px;background:#5e6cdb;color:white;font-size:21px;font-weight:800;cursor:pointer}.action:focus-visible,.choice:focus-visible{outline:4px solid #1a62b3;outline-offset:3px}.hidden{display:none}.finish{font-size:clamp(26px,7vw,38px);font-weight:900}.note{font-size:13px;opacity:.7;margin-top:18px}</style></head><body><main class="app"><div class="top"><span class="pill" id="progress">1 / 9</span><span class="pill" id="stars">⭐ 0</span><button class="pill" id="sound" aria-label="Repeat question" style="border:0;cursor:pointer;font-size:24px">🔊</button></div><h1 class="heading">🌈 Counting Fun!</h1><p class="sub">1️⃣ 2️⃣ 3️⃣</p><section class="board" aria-live="polite"><div id="play"><div class="prompt" id="prompt">How many?</div><div class="things" id="things"></div><div class="choices" id="choices"><button class="choice" data-n="1">1</button><button class="choice" data-n="2">2</button><button class="choice" data-n="3">3</button></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action hidden" id="next">Next ➜</button></div></div><div id="end" class="hidden"><div style="font-size:90px">🏆🎉</div><div class="finish">Amazing counting!</div><p style="font-size:65px">1️⃣ 2️⃣ 3️⃣</p><button class="action" id="again">🔄 Play again</button></div></section><p class="note">Tap 🔊 to hear the question again</p></main><script>const rounds=[{n:1,e:'🍎',word:'apple'},{n:2,e:'🦋',word:'butterfly'},{n:3,e:'🐥',word:'chick'},{n:1,e:'🐶',word:'dog'},{n:3,e:'🎈',word:'balloon'},{n:2,e:'🍓',word:'strawberry'},{n:3,e:'⭐',word:'star'},{n:1,e:'🦕',word:'dinosaur'},{n:2,e:'🌸',word:'flower'}];let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;u.pitch=1.18;speechSynthesis.speak(u)}catch(e){}}function question(){const r=rounds[i];return 'How many '+(r.n===1?r.word:r.word==='butterfly'?'butterflies':r.word==='strawberry'?'strawberries':r.word+'s')+'?'}function render(){locked=false;const r=rounds[i];$('progress').textContent=(i+1)+' / '+rounds.length;$('stars').textContent='⭐ '+score;$('prompt').textContent='👀 How many?';$('things').innerHTML=Array.from({length:r.n},()=>'<span class="thing" role="img" aria-label="'+r.word+'">'+r.e+'</span>').join('');$('feedback').textContent='';$('next').classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>{b.disabled=false;b.style.outline=''});setTimeout(()=>say(question()),350)}function answer(n,b){if(locked)return;const r=rounds[i];if(n===r.n){locked=true;score++;$('stars').textContent='⭐ '+score;$('feedback').textContent='🌟 Great job! 👏';b.style.outline='5px solid #42c779';document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('next').classList.remove('hidden');$('next').textContent=i===rounds.length-1?'🏆 Finish':'Next ➜';say('Great job! '+r.n+'!')}else{$('feedback').textContent='💖 Try again!';say('Try again!');b.style.outline='4px solid #f28d9a';setTimeout(()=>b.style.outline='',550)}}document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.n),b)));$('sound').addEventListener('click',()=>say(i<rounds.length?question():'Amazing counting!'));$('next').addEventListener('click',()=>{i++;if(i>=rounds.length){$('play').classList.add('hidden');$('end').classList.remove('hidden');$('progress').textContent='9 / 9';say('Amazing counting! You did it!')}else render()});$('again').addEventListener('click',()=>{i=0;score=0;$('end').classList.add('hidden');$('play').classList.remove('hidden');render()});render();</script></body></html>
